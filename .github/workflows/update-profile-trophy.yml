name: Update Profile Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile trophies
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=nishanthpn006&theme=tokyonight&no-bg=true&no-frame=true&row=1&column=7&margin-w=4'
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          if git diff --staged --quiet; then
            echo "No changes in trophy SVG to commit."
          else
            git commit -m "Update GitHub trophies [skip ci]"
            git push
          fi
